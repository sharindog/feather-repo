name: Import IPA from Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag'
        required: true
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download IPA assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          mkdir -p /tmp/ipa icons
          gh release download "$RELEASE_TAG" --pattern '*.ipa' --dir /tmp/ipa
          find /tmp/ipa -maxdepth 1 -name '*.ipa' -print
          test -n "$(find /tmp/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
      - name: Build catalog
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          find /tmp/ipa -maxdepth 1 -name '*.ipa' -print0 | while IFS= read -r -d '' file; do
            python scripts/build.py "$file" "$RELEASE_TAG"
          done
          python -m json.tool apps.json >/dev/null
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json icons/
          if ! git diff --cached --quiet; then
            git commit -m "Update Feather catalog from release"
            git push
          fi
